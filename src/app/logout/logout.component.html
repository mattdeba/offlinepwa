<ion-grid>
  <ion-row class="header-row">
    <ion-col size-xs="1" size-sm="1" size-lg="4"></ion-col>
    <ion-col size-xs="10" size-sm="10" size-lg="4" id="title2">
      <h5>Déconnexion</h5>
    </ion-col>
    <ion-col size-xs="1" size-sm="1" size-lg="4"></ion-col>
  </ion-row>
  <ion-row>
    <ion-col size-xs="1" size-sm="1" size-lg="4"></ion-col>
    <ion-col size-xs="10" size-sm="10" size-lg="4">
      <ion-text>
        Confirmer la déconnexion<br>
      </ion-text>
    </ion-col>
    <ion-col size-xs="1" size-sm="1" size-lg="4"></ion-col>
  </ion-row>
  <ion-row>
    <ion-col size-xs="1" size-sm="1" size-lg="4"></ion-col>
    <ion-col size-xs="10" size-sm="10" size-lg="4" class="center-align">
      <ion-button [color]="'light'" (click)="logout()" *ngIf="isAuthenticated">
        Se déconnecter
      </ion-button>
    </ion-col>
    <ion-col size-xs="1" size-sm="1" size-lg="4"></ion-col>
  </ion-row>
</ion-grid>
